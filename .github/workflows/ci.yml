name: CI

on:
  push:
    branches: [main, codex/portfolio-interface]
  pull_request:

jobs:
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:content
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-diagnostics
          path: test-results/

  compiled-demos:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test committed artifacts against sanitized native builds
        run: npm run test:wasm
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: '6.0.5'
      - name: Rebuild with the pinned Emscripten SDK
        run: npm run build:wasm
      - name: Test rebuilt artifacts against native builds
        run: npm run test:wasm
      - name: Reject generated artifact drift
        run: git diff --exit-code -- public/wasm
