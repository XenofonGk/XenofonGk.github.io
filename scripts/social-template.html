<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><style>
    @font-face {
      font-family: Archivo;
      src: url(data:font/woff2;base64,__FONT__);
      font-weight: 100 900;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      width: 1200px;
      height: 630px;
      background: #f3f0e8;
      color: #232b2a;
      font-family: Archivo, sans-serif;
      padding: 55px 65px;
      display: flex;
      flex-direction: column;
    }
    .top {
      display: flex;
      justify-content: space-between;
      padding-bottom: 28px;
      border-bottom: 1px solid #a2a69c;
      font-size: 22px;
    }
    .top b {
      letter-spacing: -2px;
      font-size: 30px;
    }
    .top b span {
      color: #a93320;
    }
    .label {
      font: 17px monospace;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #515d59;
      margin-top: 50px;
    }
    h1 {
      font-size: 76px;
      line-height: 1.05;
      font-weight: 600;
      letter-spacing: -3px;
      max-width: 1000px;
      margin: 22px 0;
    }
    .bottom {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      color: #515d59;
    }
    .mark {
      color: #a93320;
    }
  </style>
  <div class="top">
    <b>xg<span>/</span>builds</b><span>Xenofon Gkioka · Toronto</span>
  </div>
  <div class="label">__LABEL__</div>
  <h1>__TITLE__</h1>
  <div class="bottom">
    <span>Full-stack development, thoughtfully built.</span
    ><span class="mark">xgbuilds.dev ↗</span>
  </div>
</html>
