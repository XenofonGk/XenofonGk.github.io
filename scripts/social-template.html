<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><style>
    @font-face {
      font-family: Archivo;
      src: url(data:font/woff2;base64,__FONT__);
      font-weight: 100 900;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      width: 1200px;
      height: 630px;
      background-color: #f1eee7;
      background-image:
        linear-gradient(rgba(20, 17, 13, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(20, 17, 13, 0.08) 1px, transparent 1px);
      background-size: 120px 120px;
      color: #14110d;
      font-family: Archivo, sans-serif;
      padding: 48px 60px 0;
      display: flex;
      flex-direction: column;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 22px;
      border-bottom: 3px solid #14110d;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
      font-weight: 800;
      font-size: 32px;
      letter-spacing: -1.5px;
    }
    .mark {
      display: grid;
      place-items: center;
      width: 60px;
      height: 60px;
      background: #14110d;
      color: #f1eee7;
      font-weight: 900;
      font-size: 26px;
      box-shadow: 6px 6px 0 #e63f00;
    }
    .brand .slash {
      color: #e63f00;
    }
    .label {
      font: 600 18px monospace;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #6a6255;
      margin-top: 52px;
    }
    .label b {
      color: #b33000;
    }
    h1 {
      font-size: 92px;
      line-height: 0.92;
      font-weight: 900;
      letter-spacing: -3px;
      text-transform: uppercase;
      max-width: 1060px;
      margin: 22px 0;
    }
    /* Project names keep their own spelling (ai-eng, KykloC). */
    h1 .name {
      text-transform: none;
      font-size: 120px;
    }
    h1 em {
      font-style: normal;
      color: #e63f00;
    }
    .block {
      margin-top: auto;
      display: grid;
      grid-template-columns: 1.3fr 1fr 1fr;
      border-top: 3px solid #14110d;
      border-left: 3px solid #14110d;
      margin-inline: -60px;
      background: #f1eee7;
    }
    .block div {
      border-right: 3px solid #14110d;
      padding: 14px 20px 18px;
      font-size: 22px;
      font-weight: 700;
    }
    .block small {
      display: block;
      font: 600 13px monospace;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #6a6255;
      margin-bottom: 6px;
    }
  </style>
  <div class="top">
    <div class="brand">
      <span class="mark">XG</span
      ><span>xg<span class="slash">/</span>builds</span>
    </div>
  </div>
  <div class="label"><b>§</b> __LABEL__</div>
  <h1>__TITLE__</h1>
  <div class="block">
    <div><small>Drawn by</small>Xenofon Gkioka</div>
    <div><small>Location</small>Toronto, Canada</div>
    <div><small>Address</small>xgbuilds.dev</div>
  </div>
</html>
